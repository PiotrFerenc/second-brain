name: Package source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source
        run: |
          git ls-files > /tmp/files.txt
          7z a -mx=9 second-brain-source.7z @/tmp/files.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" second-brain-source.7z \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Archiwum 7z zrodel (bez kompilacji) z commita ${{ github.sha }}"
