name: Package source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip source
        run: |
          # bez dokumentacji i .claude; Skills/*.md to czesc aplikacji
          # appsettings.json jest w .gitignore (klucze), a csproj go kopiuje - zip dostaje szablon
          for p in SecondBrain.Desktop SecondBrain.PipelineTest; do cp $p/appsettings.Example.json $p/appsettings.json; done
          { git ls-files | grep -v -E '^(\.claude/|[^/]+\.md$)'; ls SecondBrain.*/appsettings.json; } | zip -9 -X -@ second-brain-source.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" second-brain-source.zip \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Zip zrodel (bez kompilacji) z commita ${{ github.sha }}"
